<!doctype html>
<html lang="zh-Hant">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Code Quest</title>
    <style>
        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            min-height: 100vh;
            overflow-x: hidden;
            color: #f8fafc;
            font-family: Arial, "Microsoft JhengHei", sans-serif;
            background: #0f2130;
        }

        button,
        textarea,
        input {
            font: inherit;
        }

        button {
            cursor: pointer;
        }

        .shell {
            min-height: 100vh;
            background:
                linear-gradient(135deg, rgba(16, 37, 54, 0.92), rgba(7, 18, 30, 0.84)),
                url("/static/pages/images/mainbackground.png") center/cover no-repeat;
        }

        .topbar {
            position: sticky;
            top: 0;
            z-index: 5;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 18px;
            min-height: 78px;
            padding: 14px clamp(18px, 5vw, 74px);
            background: #111827;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.26);
        }

        .logo {
            color: #facc15;
            font-size: clamp(26px, 4vw, 42px);
            font-weight: 900;
            letter-spacing: 0;
            text-shadow: 0 4px 0 #5b2b12, 0 8px 0 rgba(0, 0, 0, 0.4);
            transform: rotate(-2deg);
        }

        .top-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .nav-pill,
        .primary-button,
        .secondary-button,
        .ai-button,
        .tab-button {
            border: 0;
            border-radius: 8px;
            font-weight: 800;
        }

        .nav-pill {
            display: inline-flex;
            align-items: center;
            padding: 10px 14px;
            color: #dbeafe;
            background: #1f2937;
            text-decoration: none;
        }

        .primary-button {
            padding: 14px 24px;
            color: #102018;
            background: #34d399;
            box-shadow: 0 12px 0 #167853, 0 18px 38px rgba(0, 0, 0, 0.32);
        }

        .secondary-button {
            padding: 11px 16px;
            color: #f8fafc;
            background: #334155;
        }
	.ai-button {
	    display: inline-block;
	    padding: 14px 24px;
	    color: #10202d;       
	    background: #3b82f6;      
	    box-shadow: 0 12px 0 #1d4ed8, 0 18px 38px rgba(0, 0, 0, 0.32); 
	    /* #可加可不加 
	    border: none;
	    border-radius: 12px;   
	    font-weight: bold;    
	    text-decoration: none; 
	    cursor: pointer; */
	}
	
	.ai-button:hover {
	    background: #60a5fa;
	}
	
	.ai-button:active {
	    box-shadow: 0 4px 0 #1d4ed8, 0 8px 18px rgba(0, 0, 0, 0.32);
	    transform: translateY(8px); 
	}
	
        .start-screen {
            display: grid;
            min-height: calc(100vh - 78px);
            place-items: center;
            padding: 44px 22px;
        }

        .start-card {
            width: min(780px, 100%);
            text-align: center;
        }

        .title-frame {
            margin: 0 auto 34px;
            padding: 28px;
            border: 5px solid #0b1220;
            border-radius: 8px;
            color: #fff7ed;
            background: rgba(15, 23, 42, 0.74);
            box-shadow: 0 18px 0 rgba(0, 0, 0, 0.22);
        }

        h1 {
            margin: 0;
            font-size: clamp(48px, 10vw, 104px);
            line-height: 1;
            letter-spacing: 0;
        }

        .subtitle {
            margin: 18px auto 0;
            max-width: 640px;
            color: #bfdbfe;
            font-size: 20px;
            line-height: 1.7;
        }

        .map-screen {
            display: none;
            min-height: calc(100vh - 78px);
            padding: 26px 0 34px;
        }

        .map-screen.is-active {
            display: block;
        }

        .map-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 18px;
            padding: 0 clamp(18px, 5vw, 74px) 22px;
        }

        .map-head h2 {
            margin: 0;
            color: #ffffff;
            font-size: clamp(28px, 4vw, 44px);
            letter-spacing: 0;
            text-shadow: 0 4px 0 rgba(0, 0, 0, 0.28);
        }

        .map-head p {
            margin: 8px 0 0;
            color: #cbd5e1;
        }

        .map-window {
            position: relative;
            min-height: 560px;
            overflow-x: auto;
            overflow-y: hidden;
            padding: 70px 80px 130px;
            border-top: 1px solid rgba(255, 255, 255, 0.12);
            border-bottom: 1px solid rgba(255, 255, 255, 0.12);
            background:
                radial-gradient(circle at 14% 24%, rgba(255, 255, 255, 0.08) 0 46px, transparent 47px),
                radial-gradient(circle at 46% 68%, rgba(255, 255, 255, 0.07) 0 58px, transparent 59px),
                radial-gradient(circle at 84% 30%, rgba(255, 255, 255, 0.07) 0 52px, transparent 53px);
        }

        .map-window::-webkit-scrollbar {
            height: 14px;
        }

        .map-window::-webkit-scrollbar-thumb {
            border-radius: 999px;
            background: #facc15;
        }

        .map-track {
            position: relative;
            display: flex;
            align-items: center;
            gap: 130px;
            width: max-content;
            min-width: 1150px;
            min-height: 360px;
        }
        
        .notebook-wrap {
	    display: flex;
	    flex-direction: column;
	    background: #0d0d1a;
	    border-radius: 8px;
	    overflow: hidden;
	    font-family: 'Fira Code', 'JetBrains Mono', monospace;
	    min-height: 400px;
	}
        .topic-heading {
            margin: 0 0 16px;
            color: #111827;
            font-size: 20px;
        }

        .topic-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 12px;
        }

        .topic-card {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 6px;
            padding: 16px;
            border: 3px solid #111827;
            border-radius: 8px;
            background: #fff7ed;
            box-shadow: 0 6px 0 #d6b98a;
            cursor: pointer;
            text-align: left;
            transition: transform 0.15s;
        }

        .topic-card:hover {
            transform: translateY(-4px);
        }

        .topic-id {
            font-size: 11px;
            color: #6b7280;
            font-weight: 700;
        }

        .topic-title {
            font-size: 16px;
            font-weight: 900;
            color: #111827;
        }

        .topic-desc {
            font-size: 13px;
            color: #374151;
            line-height: 1.5;
        }
        .discussion-wrap { display: flex; flex-direction: column; gap: 16px; }

        .discussion-heading { margin: 0 0 12px; color: #111827; font-size: 18px; }

        .discussion-topic-grid {
            display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px;
        }

        .discussion-topic-btn {
            padding: 8px 14px; border: 2px solid #111827; border-radius: 8px;
            background: #fff; color: #111827; font-weight: 700; cursor: pointer;
            transition: all 0.15s;
        }
        .discussion-topic-btn.is-active {
            background: #34d399; border-color: #167853;
        }

        .discussion-new-post { margin-bottom: 16px; }

        .discussion-textarea {
            width: 100%; min-height: 80px; padding: 10px 12px;
            border: 2px solid #d1d5db; border-radius: 8px;
            font: inherit; font-size: 14px; resize: vertical;
            color: #111827; background: #fff;
        }

        .discussion-submit-btn {
            padding: 8px 16px; border: 0; border-radius: 8px;
            background: #34d399; color: #102018;
            font-weight: 800; cursor: pointer;
        }

        .discussion-post {
            padding: 14px; border: 2px solid #e5e7eb;
            border-radius: 8px; background: #fff;
            margin-bottom: 12px;
        }

        .post-header { display: flex; gap: 10px; align-items: center; margin-bottom: 8px; }
        .post-author { font-weight: 800; color: #111827; font-size: 14px; }
        .post-time { color: #9ca3af; font-size: 12px; }
        .post-content { color: #374151; font-size: 14px; line-height: 1.6; margin-bottom: 10px; }

        .post-actions { display: flex; gap: 8px; }
        .post-actions button {
            padding: 4px 10px; border: 1px solid #e5e7eb;
            border-radius: 6px; background: #f9fafb;
            color: #374151; font-size: 12px; cursor: pointer;
        }
        .post-like-btn.is-liked { background: #d1fae5; border-color: #34d399; color: #065f46; }

        .discussion-reply {
            margin-top: 8px; padding: 10px 12px;
            border-left: 3px solid #34d399;
            background: #f9fafb; border-radius: 0 6px 6px 0;
        }

        .discussion-login-hint {
            padding: 12px; color: #6b7280; font-size: 14px;
        }
        .discussion-login-hint a { color: #34d399; font-weight: 700; }

        .discussion-empty { color: #9ca3af; font-size: 14px; padding: 20px 0; text-align: center; }
        .discussion-loading { color: #9ca3af; font-size: 14px; padding: 20px 0; text-align: center; }
        /* Toolbar */
        .nb-toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 14px;
            background: #12122a;
            border-bottom: 1px solid #2a2a50;
        }
        .nb-question {
            padding: 12px 16px;
            background: #1a1a2e;
            border-bottom: 1px solid #2a2a50;
            color: #a9b1d6;
            font-size: 13px;
            line-height: 1.7;
        }
        .nb-cell-locked {
            border-left: 3px solid #e0af68 !important;
            opacity: 0.9;
        }
        .nb-locked-badge {
            position: absolute;
            top: 4px;
            right: 8px;
            font-size: 11px;
            color: #e0af68;
        }

        .nb-cell-locked .CodeMirror {
            cursor: not-allowed !important;
        }
        .nb-title { color: #a9b1d6; font-size: 13px; font-weight: 600; }
        .nb-toolbar-actions { display: flex; gap: 6px; }
        .nb-btn {
            padding: 4px 10px;
            background: #1e1e3f;
            border: 1px solid #3b3b6d;
            border-radius: 4px;
            color: #a9b1d6;
            font-size: 12px;
            cursor: pointer;
            transition: background 0.15s;
        }
        .nb-btn:hover { background: #2a2a5a; }

        /* Cell */
        .nb-cell {
            display: flex;
            align-items: stretch;
            border-bottom: 1px solid #1a1a35;
            position: relative;
            transition: border-left 0.1s;
            border-left: 3px solid transparent;
        }
        .nb-cell.is-active  { border-left-color: #7aa2f7; }
        .nb-cell.is-running { border-left-color: #e0af68; }

        .nb-cell-gutter {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 8px 4px;
            min-width: 50px;
            background: #0d0d1a;
            gap: 6px;
        }
        .nb-run-btn {
            background: none;
            border: none;
            color: #9ece6a;
            font-size: 15px;
            cursor: pointer;
            padding: 0;
            opacity: 1;
            line-height: 1;
        }
        .nb-run-btn:hover { color: #c3e88d; }
        .nb-counter { color: #3b4261; font-size: 11px; white-space: nowrap; }

        .nb-cell-body { flex: 1; overflow: hidden; }

        .nb-del-btn {
            position: absolute;
            top: 4px;
            right: 4px;
            background: none;
            border: none;
            color: #3b4261;
            cursor: pointer;
            font-size: 12px;
            color: #f7768e;
            opacity: 1;
            transition: opacity 0.15s;
        }
        .nb-cell:hover .nb-del-btn { opacity: 1; }
        .nb-del-btn:hover { color: #f7768e; }

        /* CodeMirror 覆寫 */
        .nb-editor .CodeMirror {
            background: #1a1b2e !important;
            color: #a9b1d6 !important;
            font-size: 13px;
            height: auto;
            min-height: 52px;
            font-family: 'Fira Code', 'JetBrains Mono', monospace;
        }
        .nb-editor .CodeMirror-gutters {
            background: #12122a !important;
            border-right: 1px solid #2a2a50 !important;
        }
        .nb-editor .CodeMirror-linenumber { color: #3b4261 !important; }

        /* Output */
        .nb-output {
            padding: 0;
            font-size: 12px;
            white-space: pre-wrap;
            font-family: 'Fira Code', monospace;
            margin-left: 50px;
            max-height: 200px;
            overflow-y: auto;
        }
        .nb-output.is-stdout {
            padding: 6px 10px;
            color: #c3e88d;
            background: #0d1117;
            border-top: 1px dashed #1a2a1a;
        }
        .nb-output.is-error {
            padding: 6px 10px;
            color: #f7768e;
            background: #1a0d0d;
            border-top: 1px dashed #2a1a1a;
        }

        /* Footer */
        .nb-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 14px;
            background: #12122a;
            border-top: 1px solid #2a2a50;
            flex-wrap: wrap;
            gap: 8px;
        }
        .nb-kernel-status { font-size: 11px; color: #565f89; }
        .nb-submit-row { display: flex; align-items: center; gap: 8px; }
        .nb-player-input {
            padding: 4px 8px;
            background: #1e1e3f;
            border: 1px solid #3b3b6d;
            border-radius: 4px;
            color: #a9b1d6;
            font-size: 12px;
            width: 120px;
        }
        .nb-submit-btn {
            padding: 5px 14px;
            background: #7aa2f7;
            border: none;
            border-radius: 4px;
            color: #0d0d1a;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.15s;
        }
        .nb-submit-btn:hover { background: #89b4fa; }
        .nb-submit-status { font-size: 12px; color: #9ece6a; }

        /* PyBryt 回饋 */
        .nb-feedback {
            padding: 12px 16px;
            background: #0d1117;
            border-top: 1px solid #2a2a50;
        }
        .fb-title { color: #a9b1d6; font-size: 13px; margin: 0 0 8px; }
        .fb-list { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 4px; }
        .fb-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
        }
        .fb-pass { background: #0d2010; color: #9ece6a; }
        .fb-fail { background: #2a0d10; color: #f7768e; }
        .fb-icon { font-weight: 700; }
        .fb-name { font-weight: 600; }
        .fb-msg  { opacity: 0.8; }

        .map-track::before {
            position: absolute;
            top: 48%;
            left: 96px;
            width: calc(100% - 192px);
            height: 12px;
            border-radius: 999px;
            background: repeating-linear-gradient(90deg, #eab308 0 54px, #92400e 54px 78px);
            box-shadow: 0 8px 0 rgba(0, 0, 0, 0.22);
            content: "";
        }

        .level-node {
            position: relative;
            z-index: 1;
            display: grid;
            width: 190px;
            min-height: 240px;
            place-items: center;
            border: 0;
            color: #fff7ed;
            background: transparent;
            text-align: center;
            transform: translateY(calc((var(--lift) * -74px) + 30px));
        }

        .level-island {
            display: grid;
            width: 172px;
            height: 146px;
            place-items: center;
            border: 5px solid #3f2a19;
            border-radius: 42% 58% 52% 48% / 46% 39% 61% 54%;
            background:
                linear-gradient(145deg, #5b3a22 0 24%, #8b5e34 25% 45%, #315f3b 46% 100%);
            box-shadow: 0 14px 0 #1f2937, 0 28px 38px rgba(0, 0, 0, 0.32);
            transition: transform 0.18s ease, filter 0.18s ease;
        }

        .level-node:hover .level-island,
        .level-node.is-selected .level-island {
            filter: brightness(1.12);
            transform: translateY(-8px);
        }

        .level-icon {
            display: grid;
            width: 74px;
            height: 74px;
            place-items: center;
            border: 5px solid #78350f;
            border-radius: 50%;
            color: #422006;
            background: #facc15;
            font-size: 34px;
            font-weight: 900;
            box-shadow: inset 0 -9px 0 rgba(146, 64, 14, 0.24);
        }

        .level-name {
            display: block;
            margin-top: 18px;
            padding: 10px 14px;
            border: 3px solid #111827;
            border-radius: 8px;
            color: #111827;
            background: #fef3c7;
            font-size: 20px;
            font-weight: 900;
            box-shadow: 0 6px 0 rgba(0, 0, 0, 0.28);
        }

        .level-code {
            display: block;
            margin-top: 9px;
            color: #e5e7eb;
            font-weight: 800;
            text-shadow: 0 3px 0 rgba(0, 0, 0, 0.36);
        }

        .detail-panel {
            display: none;
            margin: 24px clamp(18px, 5vw, 74px) 0;
            border: 4px solid #0b1220;
            border-radius: 8px;
            background: #f8fafc;
            color: #111827;
            box-shadow: 0 18px 0 rgba(0, 0, 0, 0.24);
        }

        .detail-panel.is-open {
            display: block;
        }

        .detail-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            padding: 18px;
            color: #f8fafc;
            background: #111827;
        }

        .detail-title h3 {
            margin: 0;
            font-size: 28px;
        }

        .detail-title span {
            display: block;
            margin-top: 6px;
            color: #cbd5e1;
        }

        .tabs {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            padding: 14px 18px;
            background: #e2e8f0;
        }

        .tab-button {
            padding: 11px 16px;
            color: #1f2937;
            background: #ffffff;
            box-shadow: 0 4px 0 #cbd5e1;
        }

        .tab-button.is-active {
            color: #102018;
            background: #34d399;
            box-shadow: 0 4px 0 #167853;
        }

        .tab-body {
            min-height: 480px;
            padding: 18px;
        }

        .iframe-wrap {
            height: min(58vh, 640px);
            min-height: 430px;
            overflow: hidden;
            border: 3px solid #111827;
            border-radius: 8px;
            background: #0b1020;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: 0;
            background: #ffffff;
        }

        .discussion-grid,
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 16px;
        }

        .paper-card {
            min-height: 160px;
            padding: 18px;
            border: 3px solid #111827;
            border-radius: 8px;
            background: #fff7ed;
            box-shadow: 0 8px 0 #d6b98a;
        }

        .paper-card h4 {
            margin: 0 0 10px;
            font-size: 20px;
        }

        .paper-card p {
            margin: 0;
            color: #374151;
            line-height: 1.7;
        }

        .submit-grid {
            display: grid;
            grid-template-columns: minmax(0, 1fr) 220px;
            gap: 14px;
            margin-top: 16px;
        }

        textarea {
            width: 100%;
            min-height: 150px;
            resize: vertical;
            padding: 14px;
            border: 3px solid #111827;
            border-radius: 8px;
            color: #d1fae5;
            background: #0b1020;
            line-height: 1.5;
        }

        .submit-actions {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        input {
            width: 100%;
            padding: 11px 12px;
            border: 3px solid #111827;
            border-radius: 8px;
        }

        .status {
            min-height: 44px;
            color: #166534;
            font-size: 14px;
            font-weight: 800;
            line-height: 1.5;
        }

        .logout-form {
            margin: 0;
        }

        .user-name {
            color: #a7f3d0;
            font-weight: 800;
        }

        .point-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 12px;
            border: 2px solid #92400e;
            border-radius: 8px;
            color: #422006;
            background: #facc15;
            font-weight: 900;
            box-shadow: inset 0 -4px 0 rgba(146, 64, 14, 0.22);
        }

        @media (max-width: 880px) {
            .topbar,
            .map-head,
            .detail-head {
                align-items: flex-start;
                flex-direction: column;
            }

            .map-window {
                min-height: 500px;
                padding-inline: 34px;
            }

            .map-track {
                gap: 80px;
                min-width: 980px;
            }

            .discussion-grid,
            .stats-grid,
            .submit-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="shell">
        <header class="topbar">
            <div class="top-actions">
                {% if user.is_authenticated %}
                    <span class="user-name">{{ user.username }}</span>
                    <span class="point-badge" id="pointBadge">點數 {{ user_points }}</span>
                    <a class="nav-pill" href="{% url 'submissions' %}">我的記錄</a>
                    <form class="logout-form" action="{% url 'logout' %}" method="post">
                        {% csrf_token %}
                        <button class="nav-pill" type="submit">登出</button>
                    </form>
                {% else %}
                    <a class="nav-pill" href="{% url 'login' %}">登入</a>
                {% endif %}
                <a class="primary-button" href="/admin/">管理</a>
         	<a class="ai-button" href="{% url 'ai_chat' %}">AI問答區 </a>
            </div>
        </header>

        <section class="start-screen" id="startScreen">
            <div class="start-card">
                <div class="title-frame">
                    <h1>pybryt</h1>
                </div>
                <button class="primary-button" id="startButton">開始遊戲</button>
            </div>
        </section>

        <main class="map-screen" id="mapScreen">
            <div class="map-head">
                <div>
                    <h2>章節</h2>
                </div>
                <button class="secondary-button" id="backButton">返回首頁</button>
            </div>

            <section class="map-window" aria-label="橫向地圖">
                <div class="map-track">
                    {% for level in levels %}
                        <button class="level-node" data-level="{{ level.id }}" style="--lift: {{ forloop.counter0|divisibleby:2|yesno:'0,1' }};">
                            <span class="level-island">
                                <span class="level-icon">{{ forloop.counter }}</span>
                            </span>
                            <span class="level-name">{{ level.title }}</span>
                            <span class="level-code">{{ level.chapter }} · {{ level.level }}</span>
                        </button>
                    {% endfor %}
                </div>
            </section>

            <section class="detail-panel" id="detailPanel">
                <div class="detail-head">
                    <div class="detail-title">
                        <h3 id="levelTitle">選擇關卡</h3>
                        <span id="levelMeta"></span>
                    </div>
                    <button class="secondary-button" id="closePanel">關閉關卡</button>
                </div>

                <div class="tabs">
                    <button class="tab-button is-active" data-tab="story">劇情</button>
                    <button class="tab-button" data-tab="topic">題目</button>
                    <button class="tab-button" data-tab="game">遊戲</button>
                    <button class="tab-button" data-tab="discussion">討論區</button>
                    <button class="tab-button" data-tab="stats">關卡統計</button>
                </div>

                <div class="tab-body" id="tabBody"></div>
            </section>
        </main>
    </div>

    <script>
        const levels = {{ levels_json|safe }};
        let selectedLevel = "chapter-1-level-1";
        let selectedTab = "story";
        let selectedTopic = null;
        let currentDiscussionId = null;

        const startScreen = document.querySelector("#startScreen");
        const mapScreen = document.querySelector("#mapScreen");
        const detailPanel = document.querySelector("#detailPanel");
        const levelTitle = document.querySelector("#levelTitle");
        const levelMeta = document.querySelector("#levelMeta");
        const tabBody = document.querySelector("#tabBody");
        
        let pyodide = null;
        let pyodideReady = false;
        let nbCells = new Map();   // cellId → { editor, outputEl, counterEl }
        let cellSeq = 0;
        let execCount = 0;

        async function ensurePyodide() {
            if (pyodideReady) return;
            if (!window.loadPyodide) {
            await new Promise((resolve, reject) => {
                const s = document.createElement("script");
                s.src = "https://cdn.jsdelivr.net/pyodide/v0.25.1/full/pyodide.js";
                s.onload = resolve;
                s.onerror = reject;
                document.head.appendChild(s);
            });
            }
            document.getElementById("kernelStatus").textContent = "🟡 Kernel 啟動中...";
            pyodide = await loadPyodide({ indexURL: "https://cdn.jsdelivr.net/pyodide/v0.25.1/full/" });
            pyodideReady = true;
            const el = document.getElementById("kernelStatus");
            if (el) el.textContent = "🟢 Kernel 就緒";
        }
	
        function getLevel() {
            return levels[selectedLevel];
        }
	
        function renderTab() {
            const level = getLevel();
            levelTitle.textContent = `${level.chapter}：${level.title}`;
            levelMeta.textContent = `小關：${level.level} · 難度：${level.difficulty}`;

            document.querySelectorAll(".level-node").forEach((node) => {
                node.classList.toggle("is-selected", node.dataset.level === selectedLevel);
            });

            document.querySelectorAll(".tab-button").forEach((button) => {
                button.classList.toggle("is-active", button.dataset.tab === selectedTab);
            });

            if (selectedTab === "story") {
                tabBody.innerHTML = `
                    <div class="iframe-wrap">
                        <iframe src="${level.story_url}" title="${level.title} 劇情"></iframe>
                    </div>
                `;
                return;
            }

            if (selectedTab === "game") {
            tabBody.innerHTML = `
            <div class="notebook-wrap">
                <!-- Notebook Toolbar -->
                <div class="nb-toolbar">
                    <span class="nb-title">${level.title}</span>
                    <div class="nb-toolbar-actions">
                        <button class="nb-btn" id="questionBtn">收起題目</button>
                        <button class="nb-btn" id="runAllBtn">▶▶ Run All</button>
                        <button class="nb-btn" id="addCellBtn">＋ 新增 Cell</button>
                    </div>
                </div>
                <!--Question區-->
                    <div class="nb-question" id="nbQuestion" style="display:block">
                    <p>${selectedTopic ? selectedTopic.description : level.description || ""}</p>
                    </div>
                <!-- Cells 區 -->
                <div class="nb-cells" id="nbCells"></div>

                <!-- 底部提交列 -->
                <div class="nb-footer">
                    <span class="nb-kernel-status" id="kernelStatus">⚪ Kernel 載入中...</span>
                    <div class="nb-submit-row">
                        <input class="nb-player-input" id="playerName" placeholder="玩家名稱" value="{{ user_name }}">
                        <button class="nb-submit-btn" id="submitButton">⬆ 提交 .ipynb</button>
                        <span class="nb-submit-status" id="submitStatus"></span>
                    </div>
                </div>

                <!-- 鑑定回饋區 -->
                <div class="nb-feedback" id="nbFeedback" style="display:none"></div>
            </div>
            `;
            initNotebook(level);
            return;
            }
            if (selectedTab === "topic"){
                const level = getLevel();
                const topics = level.topics || [];
                tabBody.innerHTML = `
                    <div class="topic-list">
                        <h3 class="topic-heading">${level.title} 題目列表</h3>
                        <div class="topic-grid">
                            ${topics.map(t => `
                                <button class="topic-card" data-topic-id="${t.id}">
                                    <span class="topic-id">${t.id.split('-').slice(-1)[0]}題</span>
                                    <span class="topic-title">${t.title}</span>
                                    <span class="topic-desc">${t.description}</span>
                                </button>
                            `).join("")}
                        </div>
                    </div>
                `;
                document.querySelectorAll(".topic-card").forEach(btn => {
                    btn.addEventListener("click", () => {
                        selectedTopic = level.topics.find(t => t.id === btn.dataset.topicId);
                        selectedTab = "game";
                        renderTab();
                    });
                });
                return;
            }
            if (selectedTab === "discussion") {
                const level = getLevel();
                const topics = level.topics || [];
                tabBody.innerHTML = `
                    <div class="discussion-wrap">
                        <div class="discussion-selector">
                            <h3 class="discussion-heading">${level.title} 討論區</h3>
                            <div class="discussion-topic-grid">
                                ${topics.length === 0 
                                    ? '<p style="color:#6b7280">此關卡尚無題目討論區</p>'
                                    : topics.map(t => `
                                        <button class="discussion-topic-btn ${currentDiscussionId === t.id ? 'is-active' : ''}" data-id="${t.id}">
                                            ${t.title}
                                        </button>
                                    `).join("")
                                }
                            </div>
                        </div>
                        <div class="discussion-board" id="discussionBoard">
                            ${currentDiscussionId 
                                ? '<div class="discussion-loading">載入中...</div>'
                                : '<div class="discussion-empty">請選擇題目開始討論</div>'
                            }
                        </div>
                    </div>
                `;
                document.querySelectorAll(".discussion-topic-btn").forEach(btn => {
                    btn.addEventListener("click", () => {
                        document.querySelectorAll(".discussion-topic-btn").forEach(b => b.classList.remove("is-active"));
                        btn.classList.add("is-active");
                        currentDiscussionId = btn.dataset.id;
                        loadDiscussion(currentDiscussionId);
                    });
                });
                if (currentDiscussionId) loadDiscussion(currentDiscussionId);
                return;
            }
            if (selectedTab === "stats"){
                tabBody.innerHTML = `
                    <div class="stats-grid">
                        <article class="paper-card">
                            <h4>章節</h4>
                            <p>${level.chapter}</p>
                        </article>
                        <article class="paper-card">
                            <h4>小關</h4>
                            <p>${level.level}</p>
                        </article>
                        <article class="paper-card">
                            <h4>關卡重點</h4>
                            <p>${level.summary}</p>
                        </article>
                    </div>
                `;
            }   
        }
        function openLevel(levelId) {
            selectedLevel = levelId;
            selectedTab = "story";
            selectedTopic = null; 
            currentDiscussionId = null;
            detailPanel.classList.add("is-open");
            renderTab();
            detailPanel.scrollIntoView({ behavior: "smooth", block: "start" });
        }
        //建立單一 Cell
        function createCell(initialCode = "") {
            cellSeq++;
            const id = `cell-${cellSeq}`;

            const cellEl = document.createElement("div");
            cellEl.className = "nb-cell";
            cellEl.dataset.id = id;
            cellEl.innerHTML = `
            <div class="nb-cell-gutter">
                <button class="nb-run-btn" title="執行 (Shift+Enter)">▶</button>
                <span class="nb-counter" id="counter-${id}">[ ]</span>
                
            </div>
            <div class="nb-cell-body">
                <div class="nb-editor" id="editor-${id}"></div>
                <div class="nb-output" id="output-${id}"></div>
            </div>
            <button class="nb-del-btn" title="刪除此 Cell">✕</button>
            `;

            document.getElementById("nbCells").appendChild(cellEl);

            // 載入 CodeMirro（若尚未載入則動態注入）
        function mountEditor() {
            const editor = CodeMirror(document.getElementById(`editor-${id}`), {
                value: initialCode,
                mode: "python",
                theme: "dracula",
                lineNumbers: true,
                matchBrackets: true,
                autoCloseBrackets: true,
                indentUnit: 4,
                extraKeys: {
                    "Shift-Enter": () => runCell(id),
                    "Tab": (cm) => cm.execCommand("indentMore"),
                }
            });
            editor.on("focus", () => {
                document.querySelectorAll(".nb-cell").forEach(c => c.classList.remove("is-active"));
                cellEl.classList.add("is-active");
            });
            const outputEl = document.getElementById(`output-${id}`);
            const counterEl = document.getElementById(`counter-${id}`);
            nbCells.set(id, { editor, outputEl, counterEl, cellEl });
            }

            cellEl.querySelector(".nb-run-btn").addEventListener("click", () => runCell(id));

            // 確保 CodeMirror已載入
            if (window.CodeMirror) {
            mountEditor();
            } else {
            loadCodeMirror().then(mountEditor);
            }

            // 刪除 Cell
            cellEl.querySelector(".nb-del-btn").addEventListener("click", () => {
            if (nbCells.size <= 1) return;
            nbCells.delete(id);
            cellEl.remove();
            });

            return id;
        }
            //動態載入 CodeMirror
        function loadCodeMirror() {
            return new Promise((resolve) => {
            if (window.CodeMirror) return resolve();
            const css1 = document.createElement("link");
            css1.rel = "stylesheet";
            css1.href = "https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css";
            document.head.appendChild(css1);

            const css2 = document.createElement("link");
            css2.rel = "stylesheet";
            css2.href = "https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/dracula.min.css";
            document.head.appendChild(css2);

            const js = document.createElement("script");
            js.src = "https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js";
            js.onload = () => {
                const py = document.createElement("script");
                py.src = "https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/python/python.min.js";
                py.onload = () => {
                    const ab = document.createElement("script");
                    ab.src = "https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/closebrackets.min.js";
                    ab.onload = resolve;
                    document.head.appendChild(ab);
                };
                document.head.appendChild(py);
            };
            document.head.appendChild(js);
            });
        }
        async function runCell(id) {
            const { editor, outputEl, counterEl, cellEl } = nbCells.get(id);
            const code = editor.getValue().trim();
            if (!code) return;

            await ensurePyodide();
            
            // 自動偵測並安裝需要的套件
            try {
            await pyodide.loadPackagesFromImports(code);
            } catch(e) { /* 忽略安裝錯誤 */ }

            cellEl.classList.add("is-running");
            counterEl.textContent = "[*]";
            outputEl.textContent = "";
            outputEl.className = "nb-output";

            try {
            // 捕捉 stdout
            pyodide.runPython(`
            import sys, io as _io
            _buf = _io.StringIO()
            sys.stdout = _buf
            sys.stderr = _buf
            `);
            let result;
            try {
                result = pyodide.runPython(code);
            } finally {
                pyodide.runPython("sys.stdout = sys.__stdout__; sys.stderr = sys.__stderr__");
            }
            const stdout = pyodide.runPython("_buf.getvalue()");

            execCount++;
            counterEl.textContent = `[${execCount}]`;

            let out = stdout || "";
            if (result !== undefined && result !== null && String(result) !== "undefined") {
                out += (out ? "\n" : "") + String(result);
            }
            if (out.trim()) {
                outputEl.textContent = out;
                outputEl.classList.add("is-stdout");
            }
            } catch (err) {
            execCount++;
            counterEl.textContent = `[${execCount}]`;
            outputEl.textContent = String(err);
            outputEl.classList.add("is-error");
            }

            cellEl.classList.remove("is-running");
        }

        //組出標準.ipynb
        function buildIpynb() {
            const cells = [...nbCells.values()].map(({ editor }) => {
            const source = editor.getValue();
            return {
                cell_type: "code",
                execution_count: null,
                metadata: {},
                outputs: [],
                source: source.split("\n").map((line, i, arr) =>
                    i < arr.length - 1 ? line + "\n" : line
                )
            };
            }).filter(c => c.source.join("").trim() !== "");

            return {
            nbformat: 4,
            nbformat_minor: 5,
            metadata: {
                kernelspec: { display_name: "Python 3", language: "python", name: "python3" },
                language_info: { name: "python", version: "3.10.0" }
            },
            cells
            };
        }

        //提交.ipynb到 Django
        async function submitNotebook(topic) {
            const levelId = selectedLevel;
            const status = document.getElementById("submitStatus");
            const player = document.getElementById("playerName")?.value || "player";
            const notebook = buildIpynb();

            if (notebook.cells.length === 0) {
            status.textContent = "請先在Cell中輸入程式碼。";
            return;
            }

            const body = new URLSearchParams();
            body.set("level", levelId);
            body.set("player", player);
            body.set("notebook", JSON.stringify(notebook));// ← 送.ipynb JSON

            status.textContent="提交中...";

            try {
            const response = await fetch("/submit-solution/", {
                method: "POST",
                headers: { "Content-Type": "application/x-www-form-urlencoded" },
                body
            });
            const result = await response.json();
            status.textContent = result.message;
            if (result.total_points !== null && result.total_points !== undefined) {
                const pointBadge = document.getElementById("pointBadge");
                if (pointBadge) pointBadge.textContent = `點數 ${result.total_points}`;
            }

            // 顯示 PyBryt回饋
            if (result.feedback && result.feedback.length > 0) {
                const fb = document.getElementById("nbFeedback");
                fb.style.display = "block";
                fb.innerHTML = `
                <h4 class="fb-title">${result.passed ? "全部通過！" : "PyBryt鑑定回饋"}</h4>
                <ul class="fb-list">
                ${result.feedback.map(f => `
                    <li class="fb-item ${f.passed ? 'fb-pass' : 'fb-fail'}">
                    <span class="fb-icon">${f.passed ? '正確':'錯誤'}</span>
                    <span class="fb-name">${f.name}</span>
                    <span class="fb-msg">${f.message}</span>
                    </li>
                `).join("")}
                </ul>
            `;
            }
            } catch {
            status.textContent="提交失敗，請確認 Django 伺服器仍在執行。";
            }
	    }

        //初始化整個 Notebook
        function initNotebook(level) {
            nbCells.clear();
            cellSeq = 0;
            execCount = 0;

            const topic = selectedTopic;

            if (pyodideReady) {
                setTimeout(() => {
                    const el = document.getElementById("kernelStatus");
                    if (el) el.textContent = "🟢 Kernel 就緒";
                }, 100);
            }
            //先載入 CodeMirror，再建立初始 cell
            loadCodeMirror().then(() => {
                const starterCode = topic
                    ? `# ${topic.title}\n# ${topic.description}\n\n${topic.starter_code}`
                    : `# ${level.title}\n# ${level.description}\n\n`;

                createCell(starterCode);
                // 鎖定程式碼 
                const testCode = topic ? topic.test_code : level.test_code;
                if (testCode) {
                    createLockedCell(testCode);
                }
            });
            // 啟動 Pyodide（背景執行，不阻塞UI）
            ensurePyodide();

            // 綁定按鈕
            document.getElementById("questionBtn").addEventListener("click", () => {
                const q = document.getElementById("nbQuestion");
                const btn = document.getElementById("questionBtn");
                if (q.style.display === "none") {
                    q.style.display = "block";
                    btn.textContent = "收起題目";
                } else {
                    q.style.display = "none";
                    btn.textContent = "題目";
                }
            });       
            document.getElementById("addCellBtn").addEventListener("click", () => createCell());
            document.getElementById("runAllBtn").addEventListener("click", async () => {
            for (const id of nbCells.keys()) await runCell(id);
            });
            document.getElementById("submitButton").addEventListener("click", () => submitNotebook(selectedTopic));
        }
        // 鎖定cell
        function createLockedCell(code) {
        cellSeq++;
        const id = `cell-${cellSeq}`;

        const cellEl = document.createElement("div");
        cellEl.className = "nb-cell nb-cell-locked";
        cellEl.dataset.id = id;
        cellEl.innerHTML = `
            <div class="nb-cell-gutter">
                <button class="nb-run-btn" title="執行 (Shift+Enter)">▶</button>
                <span class="nb-counter" id="counter-${id}">[ ]</span>
            </div>
            <div class="nb-cell-body">
                <div class="nb-editor" id="editor-${id}"></div>
                <div class="nb-output" id="output-${id}"></div>
            </div>
            <span class="nb-locked-badge">測試區</span>
        `;

        document.getElementById("nbCells").appendChild(cellEl);

            const editor = CodeMirror(document.getElementById(`editor-${id}`), {
                value: code,
                mode: "python",
                theme: "dracula",
                lineNumbers: true,
                readOnly: true,
            });

                const outputEl = document.getElementById(`output-${id}`);
                const counterEl = document.getElementById(`counter-${id}`);
                nbCells.set(id, { editor, outputEl, counterEl, cellEl });

                cellEl.querySelector(".nb-run-btn").addEventListener("click", () => runCell(id));
            };
        
        document.querySelector("#startButton").addEventListener("click", () => {
                startScreen.style.display = "none";
                mapScreen.classList.add("is-active");
            });

        document.querySelector("#backButton").addEventListener("click", () => {
            mapScreen.classList.remove("is-active");
            detailPanel.classList.remove("is-open");
            startScreen.style.display = "grid";
        });

        document.querySelector("#closePanel").addEventListener("click", () => {
            detailPanel.classList.remove("is-open");
        });

        document.querySelectorAll(".level-node").forEach((node) => {
            node.addEventListener("click", () => openLevel(node.dataset.level));
        });

        document.querySelectorAll(".tab-button").forEach((button) => {
            button.addEventListener("click", () => {
                selectedTab = button.dataset.tab;
                renderTab();
            });
        });
        async function loadDiscussion(levelId) {
            const board = document.getElementById("discussionBoard");
            if (!board) return;
            board.innerHTML = `<div class="discussion-loading">載入中...</div>`;

            const res = await fetch(`/api/posts/?level_id=${levelId}`);
            const data = await res.json();
            renderDiscussion(board, levelId, data.posts);
        }

        function renderDiscussion(board, levelId, posts) {
            const isLoggedIn = {{ user.is_authenticated|yesno:"true,false" }};
            const username = "{{ user.username }}";

            board.innerHTML = `
                ${isLoggedIn ? `
                <div class="discussion-new-post">
                    <textarea class="discussion-textarea" id="newPostContent" placeholder="分享你的想法..."></textarea>
                    <div style="display:flex; justify-content:flex-end; margin-top:8px;">
                        <button class="discussion-submit-btn" id="newPostBtn">發表</button>
                    </div>
                </div>
                ` : `<div class="discussion-login-hint">請<a href="/accounts/login/">登入</a>後發表留言</div>`}
                <div id="postList">
                    ${posts.length === 0 ? '<div class="discussion-empty">還沒有留言，來第一個發表吧！</div>' : ""}
                    ${posts.map(p => renderPost(p, username)).join("")}
                </div>
            `;

            if (isLoggedIn) {
                document.getElementById("newPostBtn").addEventListener("click", async () => {
                    const content = document.getElementById("newPostContent").value.trim();
                    if (!content) return;
                    const res = await fetch("/api/posts/create/", {
                        method: "POST",
                        headers: {"Content-Type": "application/json", "X-CSRFToken": getCookie("csrftoken")},
                        body: JSON.stringify({ level_id: levelId, content })
                    });
                    const post = await res.json();
                    document.getElementById("newPostContent").value = "";
                    document.getElementById("postList").insertAdjacentHTML("afterbegin", renderPost(post, username));
                    bindPostEvents();
                });
            }
            bindPostEvents();
        }

        function renderPost(p, username) {
            return `
                <div class="discussion-post" data-id="${p.id}">
                    <div class="post-header">
                        <span class="post-author">${p.author}</span>
                        <span class="post-time">${p.created_at}</span>
                    </div>
                    <div class="post-content">${p.content}</div>
                    <div class="post-actions">
                        <button class="post-like-btn ${p.liked ? 'is-liked' : ''}" data-id="${p.id}">
                            👍 ${p.likes}
                        </button>
                        <button class="post-reply-btn" data-id="${p.id}">💬 回覆</button>
                        <button class="post-copy-btn" data-content="${encodeURIComponent(p.content)}">📋 複製</button>
                    </div>
                    <div class="reply-form" id="reply-form-${p.id}" style="display:none;">
                        <textarea class="discussion-textarea" id="reply-content-${p.id}" placeholder="輸入回覆..."></textarea>
                        <button class="discussion-submit-btn reply-submit-btn" data-id="${p.id}" style="margin-top:6px;">送出回覆</button>
                    </div>
                    <div class="post-replies">
                        ${(p.replies || []).map(r => `
                            <div class="discussion-reply">
                                <span class="post-author">${r.author}</span>
                                <span class="post-time">${r.created_at}</span>
                                <div class="post-content">${r.content}</div>
                            </div>
                        `).join("")}
                    </div>
                </div>
            `;
        }

        function bindPostEvents() {
            // 按讚
            document.querySelectorAll(".post-like-btn").forEach(btn => {
                btn.onclick = async () => {
                    const id = btn.dataset.id;
                    const res = await fetch(`/api/posts/${id}/like/`, {
                        method: "POST",
                        headers: {"X-CSRFToken": getCookie("csrftoken")}
                    });
                    const data = await res.json();
                    btn.textContent = `👍 ${data.likes}`;
                    btn.classList.toggle("is-liked", data.liked);
                };
            });

            // 回覆按鈕
            document.querySelectorAll(".post-reply-btn").forEach(btn => {
                btn.onclick = () => {
                    const form = document.getElementById(`reply-form-${btn.dataset.id}`);
                    form.style.display = form.style.display === "none" ? "block" : "none";
                };
            });

            // 送出回覆
            document.querySelectorAll(".reply-submit-btn").forEach(btn => {
                btn.onclick = async () => {
                    const id = btn.dataset.id;
                    const content = document.getElementById(`reply-content-${id}`).value.trim();
                    if (!content) return;
                    const res = await fetch(`/api/posts/${id}/reply/`, {
                        method: "POST",
                        headers: {"Content-Type": "application/json", "X-CSRFToken": getCookie("csrftoken")},
                        body: JSON.stringify({ content })
                    });
                    const reply = await res.json();
                    const repliesDiv = document.querySelector(`[data-id="${id}"] .post-replies`);
                    repliesDiv.insertAdjacentHTML("beforeend", `
                        <div class="discussion-reply">
                            <span class="post-author">${reply.author}</span>
                            <span class="post-time">${reply.created_at}</span>
                            <div class="post-content">${reply.content}</div>
                        </div>
                    `);
                    document.getElementById(`reply-content-${id}`).value = "";
                    document.getElementById(`reply-form-${id}`).style.display = "none";
                };
            });

            // 複製
            document.querySelectorAll(".post-copy-btn").forEach(btn => {
                btn.onclick = () => {
                    const content = decodeURIComponent(btn.dataset.content);
                    navigator.clipboard.writeText(content).then(() => {
                        btn.textContent = "✅ 已複製";
                        setTimeout(() => btn.textContent = "📋 複製", 1500);
                    });
                };
            });
        }

        function getCookie(name) {
            const value = `; ${document.cookie}`;
            const parts = value.split(`; ${name}=`);
            if (parts.length === 2) return parts.pop().split(";").shift();
        }
    </script>
</body>
</html>
